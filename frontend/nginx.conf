# Cấu hình Nginx phục vụ 1 Single Page Application (SPA) dùng client-side
# routing kiểu "path thật" (react-router-dom BrowserRouter) — khác hẳn web
# tĩnh thông thường.
#
# Vấn đề cần giải quyết: khi bạn bấm link trong app để sang "/nhan-su", đó là
# React Router tự đổi URL trên trình duyệt bằng JavaScript, KHÔNG hề gửi
# request thật nào lên server — nên Nginx chưa từng biết tới đường dẫn đó.
# Nhưng nếu người dùng F5 (tải lại trang) NGAY TẠI "/nhan-su", trình duyệt sẽ
# gửi 1 request THẬT tới Nginx xin file "/nhan-su" — mà Nginx chỉ có đúng 1
# file "index.html" cùng thư mục "assets/", không hề có file/thư mục nào tên
# "nhan-su" cả → mặc định sẽ trả về "404 Not Found".
#
# "try_files $uri $uri/ /index.html" là dòng giải quyết chuyện này: bảo Nginx
# thử tìm file khớp y hệt đường dẫn ($uri), rồi thử tìm thư mục ($uri/), nếu
# cả 2 đều không có thật thì cứ trả về "/index.html" — để React Router (chạy
# trong chính index.html đó) tự đọc URL trên thanh địa chỉ và tự hiển thị
# đúng trang tương ứng.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
